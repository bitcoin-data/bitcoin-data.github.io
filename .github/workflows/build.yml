name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so a pull request can be diffed against its base
          # branch to find which dataset entries changed.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate dataset entries
        run: python3 build.py --check
      - name: Build site
        run: python3 build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Render a preview of the changed entries
        if: github.event_name == 'pull_request'
        run: |
          python3 ci/preview.py \
            --base "origin/${{ github.base_ref }}" \
            --out preview.md
          if [ -s preview.md ]; then
            cat preview.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No dataset entries changed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "${{ github.event.number }}" > pr-number.txt

      - name: Upload the preview for the comment workflow
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dataset-preview
          path: |
            preview.md
            pr-number.txt
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
