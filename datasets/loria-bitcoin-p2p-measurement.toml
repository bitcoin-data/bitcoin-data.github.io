name = "Bitcoin P2P network crawler snapshots (LORIA)"
category = "p2p-network"
tags = ["p2p", "nodes", "reachable-nodes", "crawler", "user-agents", "geolocation", "mainnet"]
format = ["json", "csv", "binary"]
author = "Jean-Philippe Eisenbarth, Thibault Cholez, Olivier Perrin (LORIA, Université de Lorraine, Inria)"
license = "Not specified (the accompanying papers on Zenodo are CC BY 4.0)"
period_start = "2020-02-07"
period_end = "2020-07-09"
description = """
Per-crawl snapshots of the Bitcoin mainnet network: JSON lists of discovered
IPv4 nodes (hashed IP, port, services, height), CSV counts of GETADDR responses,
and JSON exports of reachable nodes with protocol version, user agent,
geolocation and autonomous system. LORIA researchers collected it with a
modified bitnodes crawler described in their papers. Useful for studying the
reachable node population; IPs are hashed and truncated, and IPv6 and Tor nodes
are absent.
"""

