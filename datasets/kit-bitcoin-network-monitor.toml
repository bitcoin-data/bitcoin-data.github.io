name = "Bitcoin network monitor snapshots (KIT DSN)"
category = "p2p-network"
tags = ["p2p", "nodes", "latency", "propagation", "user-agents", "mainnet", "json"]
author = "Till Neudecker, Matthias Grundmann, Hannes Hartenstein (DSN research group, KASTEL, KIT)"
license = "CC BY 4.0"
doi = "10.5281/zenodo.14627525"
description = """
Daily snapshots of the peers connected to KIT's Bitcoin monitoring nodes, one
JSON file per day with each peer's services, version, user agent, autonomous
system, coarse location, relay statistics and latency. The monitor connects to
reachable nodes and records what they relay, following the group's published
methodology. Useful for studying the node population and propagation over many
years; peer IP addresses are anonymised.
"""

