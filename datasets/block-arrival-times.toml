name = "Block arrival times"
category = "p2p-network"
tags = ["blocks", "propagation", "timestamps", "mainnet", "csv"]
author = "0xB10C and contributors"
license = "CC0 1.0"
description = """
Timestamps at which blocks arrived at various Bitcoin nodes, one CSV file per
node with height, hash and millisecond arrival time. Contributors extract the
timestamps from their Bitcoin Core debug logs with the included script, and CI
checks them against the block header time. Useful for measuring block
propagation delay; coverage differs by node and period.
"""

