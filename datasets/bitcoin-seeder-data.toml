name = "Bitcoin DNS seeder and crawler archive"
category = "p2p-network"
tags = ["p2p", "dns-seeds", "crawler", "nodes", "addresses", "mainnet"]
format = ["jsonl", "text", "csv", "json"]
author = "Joris Strakeljahn"
license = "Not specified"
period_start = "2026-05-10"
period_open = true
description = """
Answers of Bitcoin's mainnet DNS seeds, one JSON line per query with record
type, status, TTL and returned addresses, plus unmodified seeder and crawler
dumps archived as gzipped release assets with checksums. GitHub
Actions query every seed and service-bit subdomain with dig and download each
operator's published dump. Useful for comparing what bootstrapping nodes are
told with independent crawler views; answers come from one vantage point, so
per-seed counts are lower bounds.
"""

