name = "Lightning Network gossip capture (gossip-observer)"
category = "lightning"
tags = ["p2p", "gossip", "propagation", "timestamps", "mainnet", "parquet"]
author = "Jonathan Harvey-Buschel (Chaincode Labs)"
license = "CC BY 4.0"
doi = "10.5281/zenodo.23111325"
description = """
Lightning Network gossip messages as sent and received by instrumented LDK
nodes, with microsecond timestamps per message, peer and direction, published
as monthly Parquet archives. The collectors connect to peers chosen across
network communities and export their captures to Zenodo. Useful for studying
gossip propagation, fanout and peer sync behaviour; messages sent by
collectors are mostly replies to sync requests, not relays.
"""

