name = "Transaction ordering corpus"
category = "transactions"
tags = ["transactions", "blocks", "mining", "pools", "fees", "mainnet"]
format = ["csv"]
author = "Johnnatan Messias, Mohamed Alzayat, Balakrishnan Chandrasekaran, Krishna P. Gummadi, Patrick Loiseau and Alan Mislove (MPI-SWS)"
license = "Not specified"
period_start = "2018-01-01"
period_end = "2020-12-31"
description = """
One semicolon-separated CSV row per mined transaction with its inferred mining
pool, position in the block, fee, feerate, child-pays-for-parent flag and
pre-joined input values, plus block and miner tables. Researchers at MPI-SWS built it from a full node,
resolving spent inputs and inferring each block's miner. It suits studies of transaction ordering and fee
behaviour, but miner labels and the CPFP flag are inferred, not chain facts.
"""

