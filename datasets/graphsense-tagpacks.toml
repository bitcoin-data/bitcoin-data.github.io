name = "GraphSense public TagPacks"
category = "transactions"
tags = ["addresses", "attribution", "forensics", "mainnet"]
format = ["text"]
author = "Bernhard Haslhofer, Melitta Dragaschnig, Rainer Stütz, Matteo Romiti and Gibran Gomez (GraphSense)"
license = "MIT"
period_open = true
description = """
Attribution tags for cryptoasset addresses as YAML TagPacks: a record gives an
address a label, category, actor and link to its public source, in a pack with
creator, confidence and last-modified date. Curated by the GraphSense team
and contributors, who may submit only tags from public, dereferenceable
sources, with a separate ActorPack listing real-world entities. Useful as
ground truth for address clustering; some packs are derived snapshots of
third-party services.
"""

