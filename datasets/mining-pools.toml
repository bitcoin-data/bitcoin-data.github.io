tags = ["mining", "pools", "coinbase", "addresses", "mainnet", "signet"]
format = ["json"]
author = "0xB10C and contributors"
license = "MIT"
description = """
Known Bitcoin mining pools with their coinbase tags and coinbase output
addresses, one JSON file per pool, for mainnet and signet. Maintained by hand
from pool announcements and observed coinbases, with combined files generated
for downstream tools. Useful for attributing blocks to pools; attribution is
heuristic, and pools change tags, addresses and infrastructure.
"""

