name = "Sextortion spam Bitcoin addresses"
category = "transactions"
tags = ["addresses", "transactions", "mainnet"]
format = ["csv"]
author = "Masarah Paquet-Clouston, Matteo Romiti, Bernhard Haslhofer, Tomas Charvat"
license = "CC BY 4.0"
doi = "10.5281/zenodo.3515198"
period_start = "2018-10-02"
period_end = "2019-02-13"
description = """
A plain list of Bitcoin addresses, one per line with no header, each demanded
as payment in a sextortion spam email. Extracted from a corpus of spam messages
by the authors of the companion paper on sextortion in the Bitcoin ecosystem.
Useful as ground truth for clustering and extortion-campaign studies; it
carries addresses only, with no amounts, message text or campaign labels.
"""

