description = """
A MediaWiki XML export of every page of the en.bitcoin.it wiki with its full
revision history, plus title and image lists and the uploaded images, in one
7-Zip archive. WikiTeam collected it through the wiki's MediaWiki API and
uploaded it to the Internet Archive. Useful for studying how Bitcoin
terminology and documentation were written and revised; it is a one-off capture
and no newer dump is published.
"""

