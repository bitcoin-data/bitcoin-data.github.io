name = "Lightning Network topology gossip datasets (lnresearch)"
category = "lightning"
tags = ["gossip", "topology", "channels", "p2p", "mainnet"]
format = ["binary"]
author = "Christian Decker (lnresearch)"
license = "MIT (repository); no separate data license stated"
doi = "10.5281/zenodo.4088530"
description = """
Lightning Network gossip history: channel_announcement, channel_update and
node_announcement messages as raw bzip2-compressed message streams, one file
per snapshot. Extracted after deduplication from the gossip_store files of the
authors' c-lightning nodes, with checksums and a reader snippet in the README.
Useful for reconstructing the network topology and channel policies at any
point in time; gossip is lossy by design, so the collection is best effort.
"""

