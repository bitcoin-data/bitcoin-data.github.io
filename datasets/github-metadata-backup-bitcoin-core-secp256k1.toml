name = "bitcoin-core/secp256k1 GitHub metadata backup"
category = "development"
tags = ["github", "issues", "pull-requests", "bitcoin-core", "json"]
author = "0xB10C"
license = "Not specified; issue and comment text belongs to its GitHub authors"
description = """
A backup of all issues, pull requests, reviews and comments of the bitcoin-core/secp256k1
GitHub repository, the libsecp256k1 elliptic curve library used by Bitcoin Core, stored as one JSON file per issue and per pull request
as returned by the GitHub API. The backup is refreshed every few hours by an
automated job, and a browsable mirror is rebuilt nightly from it. It is useful
for keeping the development history available if GitHub is down or removes
content, and for analysing review activity offline; items GitHub hides or
that failed to fetch are listed in state.json.
"""

