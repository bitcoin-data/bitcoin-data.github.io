name = "Transaction inv timing traces with originator ids"
category = "p2p-network"
tags = ["p2p", "transactions", "propagation", "crawler", "timestamps", "mainnet"]
format = ["csv"]
author = "David Mödinger and Franz J. Hauck (Ulm University)"
license = "CC BY 4.0"
doi = "10.5281/zenodo.2547395"
period_start = "2019-01-17"
period_end = "2019-02-06"
description = """
Gzip-compressed CSV traces of transaction inv announcements: one row per
announcement with a millisecond timestamp, a keyed hash of the announcing
peer's address and the txid. A modified bitcoinj crawler recorded them at Ulm
University and at cloud hosts in several regions, some runs sharing a key so
originator ids match across vantage points. Useful for studying relay timing
and origin inference; an announcing peer is not necessarily the originator.
"""

