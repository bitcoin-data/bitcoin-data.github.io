name = "Blockchain overlay known-peer crawls"
category = "p2p-network"
tags = ["p2p", "topology", "crawler", "addresses", "gossip", "mainnet"]
format = ["text"]
author = "Aristodemos Paphitis, Nicolas Kourtellis and Michael Sirivianos (Cyprus University of Technology, Telefonica Research)"
license = "CC BY 4.0"
doi = "10.6084/m9.figshare.23522919"
period_start = "2020-06-26"
period_end = "2020-07-20"
description = """
Edge lists of the known-peer graphs of several cryptocurrency networks,
including Bitcoin: one file per crawl snapshot, one line per node listing the
ids of the peers it reported. Researchers at Cyprus University of Technology
and Telefonica built them by asking every reachable node for its addresses.
Useful for studying overlay topology and partitioning attacks; the edges are
potential connections and IP addresses are replaced by ids.
"""

