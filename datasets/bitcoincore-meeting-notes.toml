name = "Bitcoin Core IRC meeting summaries"
category = "development"
tags = ["bitcoin-core", "history", "meetings", "releases"]
format = ["text"]
author = "Bitcoin Core website contributors"
license = "MIT"
period_start = "2015-10-01"
period_end = "2018-11-01"
description = """
One Markdown file per Bitcoin Core development IRC meeting, with YAML front
matter and a prose summary of each topic discussed, linking to the raw channel
log and minutes. Volunteers wrote them from the #bitcoin-core-dev channel logs
and published them in the Bitcoin Core website repository. Useful for reading
what the project discussed without parsing IRC logs; summaries exist only for
the period volunteers wrote them.
"""

