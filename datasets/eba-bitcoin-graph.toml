name = "Temporal graph of Bitcoin transactions (EBA)"
category = "transactions"
tags = ["addresses", "machine-learning", "mainnet", "transactions"]
format = ["text", "binary"]
author = "Vahid Jalili"
license = "Not specified for the graph files (pipeline code GPL-3.0; the sampled communities and block statistics are CC BY-NC-SA 4.0)"
period_start = "2009-01-03"
period_end = "2024-09-26"
description = """
A temporal graph of on-chain fund flows, with script, transaction and block
nodes joined by typed time-stamped edges, as gzipped TSV files for Neo4j bulk
import and as a database dump. An ETL pipeline reconstructs it from a full
node; sampled communities and per-block summary statistics ship alongside.
Useful for graph machine learning at chain scale; transactions with over twenty
non-zero input or output scripts and zero-value outputs are excluded.
"""

