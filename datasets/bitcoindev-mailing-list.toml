name = "bitcoindev mailing list archive"
category = "development"
tags = ["bips", "consensus", "history", "mailing-list"]
format = ["text"]
author = "gnusha.org"
license = "Not specified; message text belongs to its email authors"
period_start = "2011-06-12"
period_open = true
description = """
A public-inbox mirror of the Bitcoin development mailing list, where one git
commit adds one raw email message with its full headers under a path derived
from its Message-ID. The mirror covers the list under both its Linux
Foundation and Google Groups addresses, and the old pipermail permalinks
redirect to it. Useful for offline search of protocol discussion;
it is a third-party mirror, not an official archive.
"""

