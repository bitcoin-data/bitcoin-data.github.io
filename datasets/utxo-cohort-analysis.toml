name = "Bitcoin blockchain data by cohort analysis"
category = "transactions"
tags = ["transactions", "timestamps", "mainnet"]
format = ["csv"]
author = "Yulin Liu, Luyao Zhang and Yinhong Zhao (Duke Kunshan University)"
license = "CC BY 4.0, per the Dataverse terms of use; no license block set"
doi = "10.7910/DVN/XSZQWP"
period_start = "2009-01-03"
period_end = "2021-02-10"
description = """
CSV tables of daily Bitcoin output cohorts, one row per date with counts of
unspent outputs bucketed by age and of spent outputs bucketed by lifespan, plus
metadata tables describing the columns. Computed at Duke Kunshan University by
querying the transaction input and output history and aggregating it per day.
Useful for work on holding behaviour without reprocessing the chain; only some
files cover Bitcoin, the rest cover other coins.
"""

