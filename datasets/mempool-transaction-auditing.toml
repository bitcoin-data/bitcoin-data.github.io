name = "Mempool-based transaction auditing recordings"
category = "p2p-network"
tags = ["p2p", "mempool", "transactions", "propagation", "timestamps", "mainnet"]
format = ["csv"]
author = "Jannik Albrecht and Ghassan Karame (Ruhr University Bochum)"
license = "CC BY-NC 4.0 (non-commercial use only)"
period_start = "2024-10"
period_end = "2025-07-08"
description = """
CSV tables of first-seen times for unconfirmed transactions, one row per
transaction hash and one column per observing node holding the Unix-second
timestamp at which it first received that transaction. The authors recorded
them in the mempools of their own nodes in Europe, the United States and Asia
for a paper on mempool-based transaction auditing. Useful for studying regional
relay delay; unobserved transactions are left empty.
"""

