name = "ASMap files for Bitcoin Core"
category = "p2p-network"
tags = ["p2p", "asmap", "autonomous-systems", "addresses", "routing"]
format = ["binary", "text"]
author = "ASMap contributors"
license = "MIT"
description = """
Maps from IP address ranges to autonomous system numbers, encoded for Bitcoin
Core's asmap option, with one filled and one unfilled binary file per run,
organised by year, plus a copy of the latest map at the repository root. Each
map is created collaboratively by several participants from RPKI, IRR and
routing data using kartograf, and verified and PGP-attested before merging.
Useful for diversifying peer selection by network operator rather than by
IP prefix and for studying how Bitcoin nodes are distributed across
autonomous systems; reproducing a map requires the kartograf version used at
the time.
"""

