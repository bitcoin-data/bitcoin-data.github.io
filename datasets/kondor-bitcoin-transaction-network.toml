name = "Bitcoin transaction network (Kondor et al.)"
category = "transactions"
tags = ["transactions", "addresses", "blocks", "mainnet"]
format = ["csv", "text"]
author = "Dániel Kondor, Márton Pósfai, István Csabai and Gábor Vattay (Eötvös Loránd University)"
license = "CC0 1.0"
doi = "10.5061/dryad.qz612jmcf"
period_start = "2009-01-03"
period_end = "2020-02"
description = """
Tables of the Bitcoin transaction graph with one row per transaction, input,
output and block, where addresses and transaction hashes are replaced by
numeric identifiers mapped in separate files, as compressed CSV and plain-text
tables. Extracted from the blockchain with a modified bitcoind client by
researchers at Eötvös Loránd University. Useful for network-science studies of
payment flows and wealth; identifiers differ between releases, so their files
cannot be mixed.
"""

