name = "Bitcoin mempool transaction lifecycle"
category = "transactions"
tags = ["mempool", "transactions", "fees", "propagation", "mainnet"]
format = ["parquet"]
author = "DataForge (dataforge-labs)"
license = "ODC-BY 1.0"
period_start = "2026-08-25"
period_end = "2026-09-05"
description = """
One Parquet row per observed transaction with first-seen time, time pending,
fee rate, ancestor package fields and an outcome of confirmed, dropped or
unresolved, plus tables comparing pending sets across providers and summarising
block composition. A collector polls several mempool providers and records each
transaction until it confirms or disappears. Useful for fee and
confirmation-time modelling; the public release is a sample window and fee
fields are often missing.
"""

