name = "Bitcoin address behavior dataset (BABD-13)"
category = "transactions"
tags = ["addresses", "attribution", "machine-learning", "mainnet"]
format = ["csv", "json"]
author = "Yuexin Xiang, Yuchen Lei, Ding Bao, Tiantian Li, Qingqing Yang, Wenmao Liu, Wei Ren and Kim-Kwang Raymond Choo"
license = "CC BY-NC-ND 4.0"
doi = "10.1109/TIFS.2023.3347894"
period_start = "2019-07-12"
period_end = "2021-05-26"
description = """
One row per labelled Bitcoin address in a CSV, giving the address, a numeric
class from thirteen behaviour types such as exchange, darknet market, tumbler
and Ponzi scheme, plus statistical and structural features. The authors built a
transaction graph from ledger data and computed the features for addresses
labelled by WalletExplorer. Useful for training address classifiers; labels come
from a third-party service and the licence bars commercial use and
derivatives.
"""

