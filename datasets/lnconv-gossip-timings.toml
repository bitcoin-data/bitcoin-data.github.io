name = "Lightning Network gossip timings and graph snapshot (lnconv)"
category = "lightning"
tags = ["channels", "gossip", "mainnet", "propagation", "timestamps", "topology"]
format = ["csv", "json"]
author = "Niklas Gögge, Elias Rohrer, Florian Tschorsch (TU Berlin)"
license = "MIT (code); no separate data license stated"
period_start = "2021-10-30"
period_end = "2021-10-30"
description = """
A zstd-compressed CSV with one row per observed Lightning gossip message, its
type, channel policy fields, origin timestamp and when the collector saw it,
plus a zstd-compressed lnd describegraph dump as JSON. The authors
connected to many nodes with pyln-proto and took the graph from their own
synced LND node. They are the replay input for the authors' gossip simulator,
and a one-off recording from a single collector.
"""

