name = "Open Bitcoin Metrics"
category = "blocks"
tags = ["blocks", "fees", "mining", "transactions", "mainnet"]
format = ["csv"]
author = "Diego R. Llanos (Universidad de Valladolid)"
license = "CC BY 4.0 (data and documentation), MIT (scripts)"
doi = "10.5281/zenodo.21156870"
period_start = "2009-01-01"
period_open = true
description = """
Daily Bitcoin on-chain series covering block production, blockspace, fees,
miner revenue, difficulty, estimated hashrate, supply, UTXO counts and
coin-age measures like Bitcoin days destroyed and liveliness. Each
series is a CSV with date, identifier, value and unit, computed from a
Bitcoin Core full node and a spent-output indexer. Useful for reproducible
econometric work, since every series ships its definition and the script
computing it; each archived release is a snapshot.
"""

