name = "Bitcoin memory pool transaction capture"
category = "transactions"
tags = ["mempool", "transactions", "fees", "mainnet"]
format = ["text"]
author = "Zening Zhao, Jinsong Wang (Tianjin University of Technology)"
license = "CC BY 4.0"
doi = "10.17632/t2x25md2pj.1"
period_start = "2021-04-19"
period_end = "2021-04-23"
description = """
One row per transaction in a node's mempool: txid and wtxid, size, weight,
ancestor and descendant fees, entry time, and the decoded inputs and outputs.
Captured by the authors at Tianjin University of Technology from their own full
node and published as a SQL Server dump. Useful for mempool and fee modelling;
it is one node's view, and height is the chain tip at entry, not a confirmation
height.
"""

