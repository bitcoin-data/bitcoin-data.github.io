name = "CoinJoin input-output mappings"
category = "transactions"
tags = ["coinjoin", "privacy", "transactions", "wasabi"]
format = ["json", "csv"]
author = "Jiri Gavenda, Petr Svenda, Stanislav Bobon and Vladimir Sedlacek (CRoCS, Masaryk University)"
license = "MIT"
period_start = "2025-04-10"
period_end = "2025-04-17"
description = """
CoinJoin transactions as JSON, each input and output carrying address, value
and owning wallet, plus a CSV counting the mappings enumerated per
transaction. Produced by the CRoCS group at Masaryk University from simulated
Wasabi 2 rounds with known ownership, plus a few real mainnet transactions.
Useful for measuring how much ambiguity arbitrary-value CoinJoins create; the
repository documentation is minimal, so the file layout must be read from the
code.
"""

