name = "Bitcoin mining evidence from merge-mined chains"
category = "blocks"
tags = ["blocks", "headers", "forks", "mining", "coinbase", "consensus", "mainnet"]
format = ["csv", "json"]
author = "deadmanoz"
license = "CC BY 4.0 (data), MIT (code)"
period_open = true
description = """
Merge Mining Research publishes Bitcoin parent headers and, where available,
coinbase data recovered from merge-mined chains such as Namecoin. The datasets
show which child chains shared a Bitcoin block's proof of work and provide
evidence for pool attribution. They cover blocks on Bitcoin's active chain,
stale header candidates and documented consensus-invalid blocks. The checks on
stale candidates do not establish full-block validity. Merge Mining Monitor
combines these historical datasets with live observations from Bitcoin Core and
active child chains.
"""

