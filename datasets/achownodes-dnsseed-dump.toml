author = "Ava Chow (achow101)"
license = "Not specified"
description = """
The node database of achow101's Bitcoin DNS seeder as a text dump, one line
per known address with reachability over several time windows, last-seen time,
height, services, version and user agent. Written continuously by the
dnsseedrs crawler behind the seeder, which asks nodes for addresses and keeps
retrying each one. Useful for node counts per network and software adoption; a
single live snapshot from one vantage point, without history.
"""

