name = "Invalid blocks"
category = "blocks"
tags = ["blocks", "headers", "forks", "consensus", "mainnet", "jsonl"]
author = "0xB10C and contributors"
license = "CC0 1.0 (data), MIT (code)"
description = """
Bitcoin blocks with valid proof of work that fail a named consensus rule, one
JSON record per header with the failure reason, evidence and observations.
Records come from the P2P network, merge-mined chains and archived block
explorers, and CI verifies each record's proof of work and evidence. Useful
for studying consensus failures and historical incidents; blocks only reported
as invalid are kept in a separate file.
"""

