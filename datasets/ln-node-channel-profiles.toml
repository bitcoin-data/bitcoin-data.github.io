name = "Lightning Network node and channel profiles (Bitcoin Data Labs)"
category = "lightning"
tags = ["nodes", "channels", "topology", "routing", "fees", "mainnet"]
format = ["parquet", "json"]
author = "Saurabh Kumar (Bitcoin Data Labs)"
license = "CC BY 4.0 (data), MIT (scripts)"
period_start = "2026-09-11"
period_open = true
description = """
Lightning Network profile tables as Parquet, one row per node or per channel,
with capacity, channel counts, fee policy, funding transaction, feature bits
and centrality ranks. Bitcoin Data Labs derives them from Lightning gossip and
publishes them with a full graph JSON, summary JSON snapshots and a curated
file of node entity and role tags. Useful for ranking and classifying routing
nodes; the tags and inferred implementation labels are heuristic.
"""

