name = "Freenode Bitcoin IRC log archive"
category = "development"
tags = ["bitcoin-core", "chat-logs", "history", "irc"]
format = ["text"]
author = "Bryan Bishop"
license = "Not specified; message text belongs to the channel participants"
period_start = "2010"
period_end = "2018"
description = """
A single compressed archive of early IRC logs from the Freenode channels
#bitcoin-dev, #bitcoin-core-dev and #bitcoin-otc, one plain text file per
channel with a tab-separated timestamp, nickname and message on each line.
Bryan Bishop publishes it together with an OpenTimestamps proof of the
archive. It covers the years before the daily gnusha.org logs begin; only
messages are kept, so joins, parts and other channel events are missing.
"""

