name = "Bitcoin blockchain in BigQuery"
category = "transactions"
tags = ["addresses", "blocks", "fees", "mainnet", "transactions"]
format = ["csv", "jsonl", "parquet"]
author = "Google Cloud Public Dataset Program"
license = "Not specified (bitcoin-etl extraction code is MIT)"
period_open = true
description = """
Two BigQuery tables covering the chain, one row per block and one per
transaction, with each transaction's inputs and outputs nested alongside their
addresses, script, type and value, plus views that flatten them. Google's
public dataset program hosts it, loaded by the open source Blockchain ETL
pipeline from a node. Useful for SQL analysis of the whole chain without
running an indexer; querying needs a Google Cloud project.
"""

