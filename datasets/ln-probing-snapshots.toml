name = "Lightning Network listchannels snapshots (ln-probing-simulator)"
category = "lightning"
tags = ["channels", "topology", "routing", "privacy", "mainnet"]
format = ["json"]
author = "Sergei Tikhomirov (University of Luxembourg)"
license = "MIT"
period_start = "2021-05-23"
period_end = "2021-12-09"
description = """
Core Lightning listchannels dumps as JSON, one record per directed channel
with its short channel id, endpoint public keys, capacity, base and
proportional fee, CLTV delta and HTLC minimum and maximum. They ship with the
probing simulator from a paper on parallel channels and are the graph its
experiments run on. Useful as a fixed graph for reproducing probing or routing
experiments; channel balances are not gossiped and are absent.
"""

