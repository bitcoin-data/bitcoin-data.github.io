name = "Stale blocks"
category = "blocks"
tags = ["blocks", "headers", "forks", "mainnet"]
format = ["csv", "binary"]
author = "0xB10C and contributors"
license = "CC0 1.0 (data), MIT (code)"
doi = "10.5281/zenodo.22667157"
description = """
Stale Bitcoin blocks and headers observed on the network, one CSV row per
block with height, hash and raw header, plus full blocks where available. Node
operators contribute their chain tips from Bitcoin Core's getchaintips RPC,
supplemented by fork monitors and block explorer archives. Useful for stale-
block rates and propagation studies; listed blocks are not verified to be
fully consensus-valid.
"""

