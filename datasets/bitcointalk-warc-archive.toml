name = "bitcointalk.org web crawl"
category = "development"
tags = ["forum", "history", "archive"]
format = ["text"]
author = "Internet Archive warczone collection"
license = "Not specified; the crawled forum posts belong to their authors"
period_start = "2017-10-23"
period_end = "2017-11-18"
description = """
WARC files of crawled bitcointalk.org pages, mostly full-thread views of the
forum, with gzipped CDX indexes mapping each captured URL to its offset in the
WARC files. It comes from a web crawl of the whole forum, uploaded to the
Internet Archive's warczone collection. Useful as a bulk capture of early
Bitcoin discussion; it
is raw crawled HTML in WARC containers, so extracting readable posts takes
work.
"""

