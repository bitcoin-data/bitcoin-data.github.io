name = "OFAC sanctioned digital currency addresses"
category = "transactions"
tags = ["addresses", "attribution", "forensics", "mainnet"]
format = ["text", "json"]
author = "0xB10C"
license = "MIT (tool); the addresses come from the US Treasury SDN list"
period_open = true
description = """
Every digital currency address designated by the US Office of Foreign Asset
Control, as one address per line in a text file and as a JSON list, with one
pair of files per asset. A script extracts them from the Treasury's SDN XML,
and a workflow regenerates the lists. Useful for checking whether an address is
sanctioned; the files hold current designations only, with earlier ones in the
git history.
"""

