name = "Bitcoin blockchain optimized for machine learning prediction model"
category = "transactions"
tags = ["transactions", "fees", "machine-learning", "blocks", "mainnet"]
format = ["csv", "json"]
author = "Enrico Tedeschi (UiT The Arctic University of Norway)"
license = "CC0 1.0"
doi = "10.18710/8IKVEU"
period_start = "2021-01-01"
period_end = "2021-05-31"
description = """
Separate block and transaction CSV tables, joined on block hash: blocks carry
size, height and creation time, transactions carry fee, size, broadcast time
and waiting time until inclusion. Sampled from blockchain.com APIs and a
Bitcoin Core node by Enrico Tedeschi at UiT for work on predicting which
transactions miners include. A README documents every column; coverage is
limited to the sampled monthly windows, and transaction latency can be
negative.
"""

