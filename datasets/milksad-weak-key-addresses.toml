name = "Milk Sad weak key addresses"
category = "transactions"
tags = ["addresses", "attribution", "forensics", "mainnet"]
format = ["text"]
author = "Milk Sad research team"
license = "Not specified (the repository states that a license, possibly CC BY 4.0, is still under consideration)"
description = """
Bitcoin addresses of wallets whose keys came from a broken random number
generator or a guessable passphrase, sorted text files, one address per
line, split by generator and key derivation. The Milk Sad researchers
brute-force the seed space of each flaw and keep addresses that a bloom filter
shows were used on-chain. Useful for flagging affected wallets and thefts from
them; publication is selective, so a missing address proves nothing.
"""

