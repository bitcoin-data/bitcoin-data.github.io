name = "bitcoin.fish.foo DNS seeder crawler dump"
category = "p2p-network"
tags = ["p2p", "nodes", "dns-seeds", "crawler", "reachable-nodes", "user-agents", "mainnet"]
format = ["text"]
author = "Will Clark (willcl-ark)"
license = "Not specified"
description = """
The node database of Will Clark's Bitcoin DNS seeder seed.bitcoin.fish.foo as
a text dump, one line per known address with reachability over several time
windows, height, services, version, user agent and retry statistics. Written
continuously by a dnsseedrs crawler behind the seeder. Useful as an
independent vantage point, since this seeder is not hardcoded in Bitcoin Core;
a single live snapshot without history.
"""

