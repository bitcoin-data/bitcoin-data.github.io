name = "Bitcoin blockchain fork measurements (KIT DSN)"
category = "blocks"
tags = ["blocks", "forks", "propagation", "mining", "timestamps", "mainnet"]
format = ["text"]
author = "Till Neudecker and Hannes Hartenstein (DSN research group, KASTEL, KIT)"
license = "CC BY 4.0"
period_start = "2015-10"
period_end = "2018-03"
description = """
Observed blockchain forks as plain-text tables, one row per fork with the
height, the reception times of the main-chain and orphaned block, their delay,
how many peers announced the earlier one, and each block's inferred miner.
Recorded by KIT's Bitcoin monitoring nodes, with a per-block file listing each
peer announcement of the competing blocks. Useful for studying fork resolution
and miner advantage; miner labels come from a block explorer.
"""

