name = "Instrumented Bitcoin Core experiment logs (NISLAB)"
category = "p2p-network"
tags = ["p2p", "nodes", "bitcoin-core", "blocks", "mempool", "transactions", "mainnet"]
format = ["text"]
author = "Muhammad Anas Imtiaz, David Starobinski, Ari Trachtenberg and Nabeel Younis (NISLAB, Boston University)"
license = "Not specified"
period_start = "2020-05-22"
period_end = "2020-07-21"
description = """
Plain-text event logs from Bitcoin Core nodes patched to record peer-to-peer
events, each line carrying a human-readable time, a monotonic timestamp and an
event tag covering compact block arrival and reconstruction, mempool dumps,
orphan transaction handling and scripted node churn. Boston University's NISLAB
recorded them for its churn and orphan-transaction papers. Useful for
replicating those analyses; each git branch is a separate experiment with its
own layout.
"""

