name = "Bitcoin Transcripts"
category = "development"
tags = ["archive", "bitcoin-core", "history", "meetings"]
format = ["text"]
author = "Bitcoin Transcripts contributors"
license = "MIT"
period_start = "2014-02-09"
period_open = true
description = """
One Markdown file per transcribed talk, podcast episode or developer meeting,
with YAML front matter naming the title, speakers, tags, date, the recording it
came from and who transcribed it. Volunteers and a machine transcription tool
produce them from public recordings, and a review app tracks the editing.
Useful for full-text search of what was said about a protocol change; the text
is an edited transcription, not verbatim speech.
"""

