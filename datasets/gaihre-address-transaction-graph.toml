name = "Bitcoin address-transaction bipartite graph"
category = "transactions"
tags = ["transactions", "addresses", "privacy", "mainnet"]
format = ["text", "binary"]
author = "Anil Gaihre, Yan Luo, Hang Liu (UMass Lowell)"
license = "CC BY 4.0"
period_start = "2009-01-03"
period_end = "2018-06-07"
description = """
Bipartite graph of Bitcoin addresses and transactions as a text edge list
(address, transaction, input/output flag, satoshi value) and as binary CSR
arrays with a small C++ reader. Built at UMass Lowell by parsing Bitcoin Core
block files with rusty-blockparser and numbering every address and transaction
as a vertex. Useful for large-scale analysis of address reuse and anonymity; it
is a fixed snapshot and vertex numbers are not mapped back to addresses or
transaction ids.
"""

