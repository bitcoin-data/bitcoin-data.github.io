format = ["text", "json"]
author = "Luke Dashjr"
license = "Not specified"
period_start = "2025-05-04"
period_open = true
description = """
The data behind Luke Dashjr's node count charts: a plain-text history with one
line per sample giving a Unix timestamp, the listening node count, the
estimated unreachable count and counts for selected software and service
groups. A companion JSON file breaks the same counts down by user agent and
adds per-service-bit shares. Useful for node population trends; how the
unreachable estimate is produced is not documented.
"""

