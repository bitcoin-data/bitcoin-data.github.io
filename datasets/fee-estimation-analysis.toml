name = "Fee estimates analysis"
category = "transactions"
tags = ["fees", "mempool", "transactions", "bitcoin-core", "policy", "mainnet"]
format = ["json"]
author = "Abubakar Sadiq Ismail"
license = "Not specified"
period_start = "2024-02-28"
period_end = "2024-07-01"
description = """
JSON records of fee rate estimates logged every minute by a Bitcoin Core node,
pairing a mempool-based next-block estimate and estimatesmartfee with
feerate percentiles of the block mined next. Collected by Abubakar Sadiq Ismail
from a patched node's trace and debug logs; a separate branch covers several
block-template forecasters. Useful for scoring estimators against confirmed
blocks; fee rates are strings in sat/kvB and each branch is a short sample
from one node's view.
"""

