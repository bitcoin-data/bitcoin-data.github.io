name = "Geolocated Lightning Network topology snapshots"
category = "lightning"
tags = ["topology", "channels", "nodes", "geolocation", "gossip", "mainnet"]
format = ["text", "csv"]
author = "Danila Valko, Jorge Marx Gómez (University of Oldenburg)"
license = "CC BY 4.0"
doi = "10.7910/DVN/2OAVO6"
period_start = "2019-01-20"
period_end = "2023-07-16"
description = """
Lightning Network graph snapshots as NetworkX GML files, where a node carries
its public key, alias and city-level geolocation and an edge carries a short
channel id, fee policy and HTLC limits, plus a CSV summary table. The authors
rebuilt them from the lnresearch gossip archives and geolocated nodes by IP
address. Useful for spatial and temporal network analysis; only nodes
announcing a public IP address are geocoded.
"""

