name = "Bitcoin wallet classification public dataset"
category = "transactions"
tags = ["addresses", "attribution", "forensics", "mainnet"]
format = ["text"]
author = "Gregory Wilder"
license = "ODbL 1.0 (database), contents © original authors"
period_start = "2009-01-03"
period_end = "2021-05-26"
description = """
Bitcoin addresses labelled with one of fourteen service categories, from
darknet market and tumbler through exchange and mining pool to individual
wallet. The compiler merged WalletExplorer's wallet identifications, which
supply most rows, with two research label sets and the OFAC sanctions list,
preferring WalletExplorer where they disagree. Useful for attributing addresses
at scale; most labels rest on a service that stopped updating, so coverage
thins for later blocks.
"""

