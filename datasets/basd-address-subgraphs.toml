name = "Bitcoin address subgraph dataset (BASD-8)"
category = "transactions"
tags = ["addresses", "attribution", "machine-learning", "mainnet"]
format = ["csv", "text"]
author = "Yuexin Xiang, Tiantian Li and Yuquan Li"
doi = "10.1109/BigData55660.2022.10020980"
license = "CC BY-NC-ND 4.0"
description = """
Transaction subgraphs around labelled Bitcoin addresses, covering eight
behaviour types such as darknet market, exchange, gambling, tumbler and Ponzi
scheme. The authors extracted each subgraph from a transaction graph they built
from ledger data, and also publish a compact text rendering of the subgraphs
meant for language models. Useful for structure-based address classification;
the licence bars commercial use and derivatives.
"""

