name = "getrawaddrman exports"
category = "p2p-network"
tags = ["p2p", "addrman", "addresses", "nodes", "mainnet", "json"]
author = "0xB10C"
license = "CC0 1.0"
description = """
Daily exports of the address manager of Bitcoin Core nodes via the
getrawaddrman RPC, one JSON file per node with every known address and its
metadata, with history in the git log. A scheduled job fetches the exports
from the peer.observer nodes and commits them. Useful for studying address
propagation and addrman churn; the nodes are a small sample with their own
connectivity.
"""

