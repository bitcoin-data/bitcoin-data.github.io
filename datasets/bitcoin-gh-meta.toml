name = "bitcoin/bitcoin GitHub metadata export (ghrip)"
category = "development"
tags = ["github", "issues", "pull-requests", "bitcoin-core", "json", "archived"]
author = "zw and contributors"
license = "Not specified; issue and comment text belongs to its GitHub authors"
description = """
An export of the issues, pull requests and comments of the bitcoin/bitcoin
GitHub repository, as JSON files straight from the GitHub API, grouped in
directories of 100 issues. It was produced with the ghrip tool and was
updated until May 2023; the more recent GitHub metadata backups supersede it.
It is useful for historical analysis of early Bitcoin Core development and for
viewing comment edit history; about ten early issues are missing because
GitHub's API does not return them.
"""

