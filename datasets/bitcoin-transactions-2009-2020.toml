name = "Bitcoin transactions from 2009 to 2020"
category = "transactions"
tags = ["addresses", "mainnet", "transactions"]
format = ["csv"]
author = "Ethan Wood (University College London)"
license = "CC0 1.0"
doi = "10.7910/DVN/ZLBYTZ"
period_start = "2009-01"
period_end = "2020-10"
description = """
Bitcoin value transfers, one row per sender and recipient pair with a Unix
timestamp, the sending address, the receiving address and the amount in
satoshi. Deposited on Harvard Dataverse as CSV files split by calendar month,
some also served as tab-separated tables. A simple starting point for
transaction-graph work, but the deposit does not document how the transfers
were extracted, so their exact semantics are unclear.
"""

