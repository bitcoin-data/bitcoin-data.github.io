name = "Lightning channel graph snapshot (MPP simulator)"
category = "lightning"
tags = ["channels", "mainnet", "nodes", "routing", "topology"]
format = ["json"]
author = "Charmaine Ndolo and Florian Tschorsch"
license = "MIT (repository); no separate data license stated"
period_start = "2023-05-16"
period_end = "2023-05-16"
description = """
One JSON snapshot of the public Lightning channel graph in lnd describegraph
shape: announced nodes with alias, addresses and feature bits, and channels
with capacity, funding outpoint and both directional policies. The authors
committed it to their multi-path payment simulator, whose parser also reads
graphs from the lnresearch topology dataset. It is handy as ready-made
simulator input, but a single snapshot without unannounced nodes or channels.
"""

