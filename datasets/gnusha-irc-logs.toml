name = "gnusha.org Bitcoin development IRC logs"
category = "development"
tags = ["bitcoin-core", "chat-logs", "history", "irc"]
format = ["text"]
author = "gnusha.org"
license = "Not specified; message text belongs to the channel participants"
period_start = "2014-10-19"
period_open = true
description = """
Daily plain text logs of the IRC channels used for Bitcoin Core, Lightning and
protocol development, one file per channel per day in irssi format with one
line per message, join, part or topic change. A logging client sits in the
channels and the files are served as plain directory listings. Useful
for tracing how a change was discussed; much of the traffic comes from
notification bots.
"""

