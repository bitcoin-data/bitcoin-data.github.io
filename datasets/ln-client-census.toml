name = "Lightning client and release line census"
category = "lightning"
tags = ["channels", "clients", "gossip", "mainnet", "nodes"]
format = ["json"]
author = "Saurabh Kumar (Bitcoin Data Labs)"
license = "MIT (code and aggregate data)"
description = """
Monthly JSON panels of the public Lightning Network split by client
implementation, with node counts and node and capacity shares, plus companion
panels on release line adoption, upgrade timing and exposure to security
advisories. Bitcoin Data Labs infers client and release from the feature bits
in node announcements in its own gossip snapshots. Good for studying client
concentration and patch uptake; only aggregates are published, not the gossip.
"""

