author = "Malte Möser and Arvind Narayanan (Princeton University)"
license = "Not specified"
period_end = "2021-06"
description = """
One CSV row per Bitcoin transaction with a known change output, giving the
transaction hash and that output's index. Malte Möser and Arvind Narayanan
derived it from the blockchain by extracting change outputs revealed by the
multi-input heuristic, as companion data to their address clustering paper.
It serves as a labelled set for evaluating change detection heuristics, but
the labels come from a heuristic and inherit its mistakes.
"""

