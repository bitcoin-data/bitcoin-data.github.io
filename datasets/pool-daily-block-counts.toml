name = "Daily blocks mined per entity"
category = "mining"
tags = ["mining", "pools", "blocks", "coinbase", "mainnet"]
format = ["csv"]
author = "Mary Milad, Christina Ovezik, Dimitris Karakostas and Daniel W. Woods (Blockchain Technology Lab, University of Edinburgh)"
license = "MIT"
period_start = "2018-01-01"
period_end = "2023-12-31"
description = """
Blocks mined per day by each Bitcoin mining entity, one CSV row per pool or
unattributed address with a column per day. Compiled by Edinburgh's
Blockchain Technology Lab from BigQuery block data, attributing blocks to
pools via coinbase tags and known addresses, for a paper on confidence in
mining power estimates. Useful for Nakamoto coefficient and pool-share
analyses; attribution is heuristic, and unmatched addresses count as separate
entities that may share an operator.
"""

