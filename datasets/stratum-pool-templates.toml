name = "Stratum pool templates"
category = "mining"
tags = ["mining", "pools", "coinbase", "timestamps", "propagation", "mainnet"]
format = ["parquet"]
author = "DataForge (dataforge-labs)"
license = "ODC-BY"
period_start = "2026-08-28"
period_end = "2026-09-03"
description = """
Stratum mining.notify jobs from pool endpoints, one Parquet row per job with
observation time, previous block hash, nTime, coinbase, merkle branch count and
clean-jobs flag. DataForge collects them from endpoints spanning several pool
operators, with a companion table recording collection windows and failures.
Useful for studying when pools switch to a new chain tip; the public release
is a sample from one vantage point, and full merkle branches are absent.
"""

