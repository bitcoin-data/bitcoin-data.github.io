name = "Early Lightning Network graph snapshots (LNTopology)"
category = "lightning"
tags = ["topology", "channels", "nodes", "geolocation", "mainnet"]
format = ["json"]
author = "István András Seres, László Gulyás, Dániel A. Nagy, Péter Burcsi (Eötvös Loránd University)"
license = "Not specified"
period_start = "2019-01-03"
period_end = "2019-04-18"
description = """
Lightning Network graph dumps in the lnd describegraph JSON layout: each node
with its public key, alias, announced addresses, reachability flag and
coarse geolocation, each channel with its funding outpoint, capacity and the
fee policy of both endpoints. The authors pulled them from the lndexplorer
graph API for a paper on network topology. These are early snapshots, useful
for the period before continuous collections; only a few isolated views exist.
"""

