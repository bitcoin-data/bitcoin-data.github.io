name = "Mining pool reward distribution (A Deep Dive into Bitcoin Mining Pools)"
category = "mining"
tags = ["mining", "pools", "coinbase", "addresses", "transactions", "mainnet"]
format = ["json", "csv"]
author = "Matteo Romiti, Aljosha Judmayer, Alexei Zamyatin, Bernhard Haslhofer (AIT Austrian Institute of Technology, SBA Research, Imperial College London)"
license = "CC BY 4.0"
doi = "10.5281/zenodo.3256312"
period_start = "2009-01-03"
period_end = "2018-12-31"
description = """
Per-block mining pool attributions with coinbase script, payout addresses and
attributed pool, address-to-cluster mappings, cluster tags, pool member lists
and raw payout flow graphs for AntPool, BTC.com and ViaBTC, as JSON and CSV in
a zip archive. The authors derived it from mainnet blockchain data, address
clustering and pool tag lists from blockchain.info, BTC.com and Blocktrail.
Useful for studying reward distribution within pools; attributions rest on
heuristics and third-party tags.
"""

