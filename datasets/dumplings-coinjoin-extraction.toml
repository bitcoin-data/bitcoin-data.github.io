name = "Dumplings CoinJoin extraction scan"
category = "transactions"
tags = ["transactions", "coinjoin", "privacy", "mainnet"]
format = ["text", "json"]
author = "Petr Švenda (Masaryk University)"
license = "CC BY 4.0 (data), MIT (analysis code); the Dumplings fork states none"
doi = "10.5281/zenodo.17870024"
period_start = "2018-07-19"
period_end = "2025-11-10"
description = """
CoinJoin transactions of several wallet designs found by the Dumplings
scanner, one text line per transaction with txid, block hash, block time,
inputs and outputs, plus curated false positives, missed transactions and a
JSON txid-to-coordinator map. Produced by the CRoCS group at Masaryk University
by scanning a Bitcoin Core node with their Dumplings fork. Useful for studying
CoinJoin volumes and usage; detection is heuristic, so false positives and
misses occur.
"""

