name = "Elliptic data set"
category = "transactions"
tags = ["forensics", "machine-learning", "mainnet", "transactions"]
format = ["csv"]
author = "Elliptic"
license = "CC BY-NC-ND 4.0"
description = """
A Bitcoin transaction graph with one node per transaction and one edge per flow
of coins, as three CSV files of features, edges and class labels. Elliptic
mapped the transactions to entities it had identified as licit or illicit, and
released it with a graph neural network benchmark. Useful as a
labelled benchmark for illicit-flow detection; ids are anonymised, feature
meanings are withheld and time is only a step number.
"""

