name = "Mempool snapshots and accelerator prices"
category = "transactions"
tags = ["mempool", "transactions", "fees", "pools", "mainnet"]
format = ["csv", "json"]
author = "Johnnatan Messias, Vabuk Pahari, Balakrishnan Chandrasekaran, Krishna P. Gummadi and Patrick Loiseau (MPI-SWS)"
license = "Not specified"
period_start = "2020-11-24"
period_end = "2020-12-01"
description = """
One row per unconfirmed transaction in a full mempool dump, with fee, size,
ancestor and descendant fields and dependencies, plus accelerator price quotes
for those ids. Researchers at MPI-SWS dumped getrawmempool from
their node and queried a mining pool's acceleration service. Accelerator prices cannot be reconstructed from chain data, making
this a rare record of what such services charge; coverage is limited to a
single provider.
"""

