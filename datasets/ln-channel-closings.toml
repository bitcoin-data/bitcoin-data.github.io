name = "Lightning channel closings and closing fees"
category = "lightning"
tags = ["channels", "fees", "mainnet", "nodes", "transactions"]
format = ["csv"]
author = "newabel"
license = "MIT (repository); no separate data license stated"
period_start = "2019-01-20"
period_end = "2023-02-20"
description = """
A CSV with one row per closed Lightning channel: short channel id, capacity,
closing timestamp, a reason code separating mutual from forced closes, the
closing transaction id, the alias of the owning node and the total on-chain
fee in satoshis. The author queried the mempool.space API and added the fees
of the transactions sweeping the closing outputs. Useful for costing close
types; it covers a few large nodes only.
"""

