name = "Delving Bitcoin forum archive"
category = "development"
tags = ["bitcoin-core", "forum", "history"]
format = ["json", "text"]
author = "James O'Beirne"
license = "Not specified; forum post text belongs to its authors. MIT (discourse-archive tool)"
description = """
A mirror of the Delving Bitcoin research forum: the raw Discourse JSON of
every post, and a rendered Markdown file per topic holding that thread's posts
in order, both filed by month. An automated job runs the discourse-archive
tool against the forum's public API and commits the result. Useful for
grepping and citing protocol research outside the forum; the export is
one-way, so the live site stays authoritative.
"""

