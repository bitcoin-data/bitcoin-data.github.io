name = "Bitcoin blockchain on AWS"
category = "transactions"
tags = ["addresses", "blocks", "mainnet", "transactions"]
format = ["parquet"]
author = "Amazon Web Services"
license = "Not specified for the data; the linked LICENSE covers the example code"
period_start = "2009-01-03"
period_open = true
description = """
Two tables covering the chain, one row per block and one per transaction with
inputs and outputs nested, as Parquet partitioned by date. Amazon Web
Services loads them from a Bitcoin Core node using the bitcoin-etl schema and
publishes them in a public S3 bucket. Useful for querying the chain with Athena
or any Parquet reader without running a node; the stated licence covers the
example code, not the data.
"""

