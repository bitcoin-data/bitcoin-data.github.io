name = "Non-standard transactions"
category = "transactions"
tags = ["transactions", "mempool", "policy", "mining", "mainnet", "csv"]
author = "0xB10C"
license = "CC0 1.0"
description = """
Mined Bitcoin transactions that violate Bitcoin Core's standardness policy,
one CSV row per transaction with height, mining pool, reason, txid, size and
fee details. Blocks are replayed through a Bitcoin Core test node to find
transactions its policy would reject. Useful for studying which pools mine
non-standard transactions and why; results depend on the policy of the Bitcoin
Core version used.
"""

